services:
  backend:
    build:
      target: development
    volumes:
      - ./apps/backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache

  queue-critical:
    build:
      target: development
    volumes:
      - ./apps/backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache

  queue-default:
    build:
      target: development
    volumes:
      - ./apps/backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache

  scheduler:
    build:
      target: development
    volumes:
      - ./apps/backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache

  frontend:
    build:
      target: development
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: 1
    volumes:
      - ./apps/web:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  backend_vendor:
  frontend_node_modules:
  frontend_next:
