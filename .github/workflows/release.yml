name: AGCP Release Artifact

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        run: |
          mkdir -p dist
          git archive --format=zip --output="dist/agcp-${GITHUB_REF_NAME}-source.zip" HEAD
          sha256sum "dist/agcp-${GITHUB_REF_NAME}-source.zip" > "dist/agcp-${GITHUB_REF_NAME}-source.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: agcp-${{ github.ref_name }}
          path: dist/*
