name: ${COMPOSE_PROJECT_NAME:-agcp-prod}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - edge
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/nginx-health | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    tmpfs:
      - /tmp
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "php -r \"require 'vendor/autoload.php';\" >/dev/null 2>&1 && php-fpm -t >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  queue-critical:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    command: ["php", "artisan", "queue:work", "redis", "--queue=critical,payments,wallet,supplier", "--sleep=1", "--tries=3", "--timeout=120", "--max-time=3600", "--memory=384"]
    stop_grace_period: 2m
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  queue-default:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    command: ["php", "artisan", "queue:work", "redis", "--queue=webhooks,notifications,emails,sms,invoices,reports,default", "--sleep=2", "--tries=3", "--timeout=180", "--max-time=3600", "--memory=384"]
    stop_grace_period: 2m
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  scheduler:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Araabi Global Commerce Platform}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: 1
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-agcp}
      MYSQL_USER: ${DB_USERNAME:-agcp}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --authentication-policy=caching_sha2_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/mysql/conf.d/agcp-production.cnf:/etc/mysql/conf.d/agcp-production.cnf:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  mysql_data:
  redis_data:
  backend_storage:
  backend_cache:
