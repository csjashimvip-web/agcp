map $http_x_forwarded_proto $agcp_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $agcp_forwarded_proto $agcp_hsts {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

limit_req_zone $binary_remote_addr zone=agcp_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=agcp_auth:10m rate=10r/m;

upstream agcp_frontend {
    server frontend:3000;
    keepalive 32;
}

upstream agcp_backend {
    server backend:9000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/v1/auth/ {
        limit_req zone=agcp_auth burst=20 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_PROTO $agcp_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_pass agcp_backend;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    location ^~ /api/ {
        limit_req zone=agcp_api burst=60 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_PROTO $agcp_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_pass agcp_backend;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    location = /sanctum/csrf-cookie {
        limit_req zone=agcp_auth burst=20 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_X_FORWARDED_PROTO $agcp_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_pass agcp_backend;
    }

    location ^~ /passkeys/ {
        limit_req zone=agcp_auth burst=20 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_X_FORWARDED_PROTO $agcp_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_pass agcp_backend;
    }

    location ^~ /user/passkeys {
        limit_req zone=agcp_auth burst=20 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_X_FORWARDED_PROTO $agcp_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_pass agcp_backend;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass agcp_backend;
        access_log off;
    }

    location ^~ /_next/static/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://agcp_frontend;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $agcp_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_pass http://agcp_frontend;
    }

    add_header Strict-Transport-Security $agcp_hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
}
